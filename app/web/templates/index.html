<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X32 AI Feedback Suppression</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b5bd6'/%3E%3Cpath d='M18 58 L34 36 L50 68 L66 28 L82 52' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f4f7;
      --card-bg: #ffffff;
      --border: #e3e4ea;
      --text: #17181c;
      --text-muted: #6b6d78;
      --accent: #5b5bd6;
      --accent-hover: #4949c4;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --idle-bg: #eceef2;
      --hover: rgba(91, 91, 214, 0.06);
      --radius: 0.65rem;
      --shadow: 0 1px 2px rgba(17, 17, 26, 0.04), 0 4px 16px rgba(17, 17, 26, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131318;
        --card-bg: #1b1c22;
        --border: #2d2e37;
        --text: #f1f2f6;
        --text-muted: #999bab;
        --accent: #8484ea;
        --accent-hover: #9d9dee;
        --success: #4ade80;
        --success-bg: rgba(74, 222, 128, 0.14);
        --warning: #fbbf24;
        --warning-bg: rgba(251, 191, 36, 0.14);
        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.14);
        --idle-bg: #26272f;
        --hover: rgba(132, 132, 234, 0.09);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header.topbar h1 {
      font-size: 1.05rem;
      font-weight: 650;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; flex: none; }
    .badge.status-connected { color: var(--success); background: var(--success-bg); }
    .badge.status-disconnected { color: var(--danger); background: var(--danger-bg); }
    .badge.status-pending { color: var(--text-muted); background: var(--idle-bg); }

    main { padding: 1.5rem; max-width: 1180px; margin: 0 auto; display: grid; gap: 1.25rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }
    .card h2 {
      margin: 0 0 1rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .field { margin-bottom: 0.7rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .field label { min-width: 7rem; font-size: 0.84rem; color: var(--text-muted); }
    select, input[type=text], input[type=number] {
      font: inherit;
      font-size: 0.84rem;
      padding: 0.4rem 0.55rem;
      border-radius: 0.45rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input[type=checkbox] { width: 1rem; height: 1rem; accent-color: var(--accent); }

    .btn {
      font: inherit;
      font-size: 0.84rem;
      font-weight: 550;
      padding: 0.45rem 0.9rem;
      border-radius: 0.45rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.05s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; font-weight: 700; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 0.28rem 0.6rem; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.7rem; }

    .status { margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted); min-height: 1.1em; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .channel-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; margin: 0.9rem 0; }
    .channel-count { font-size: 0.8rem; color: var(--text-muted); }
    .channel-toolbar-controls { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .checkbox-field { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--text-muted); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    thead th {
      position: sticky; top: 0;
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 650;
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--hover); }
    tr.state-inserted td:first-child { box-shadow: inset 3px 0 0 var(--success); }
    tr.state-bypassed td:first-child { box-shadow: inset 3px 0 0 var(--warning); }

    .chip { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.72rem; font-weight: 650; white-space: nowrap; }
    .chip.inserted { background: var(--success-bg); color: var(--success); }
    .chip.bypassed { background: var(--warning-bg); color: var(--warning); }
    .chip.idle { background: var(--idle-bg); color: var(--text-muted); }

    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 0.95rem; line-height: 1;
      padding: 0.25rem 0.45rem; border-radius: 0.35rem;
    }
    .icon-btn:hover { color: var(--danger); background: var(--danger-bg); }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; background: none; color: var(--text-muted); }
    .num-input { width: 4.2rem; }

    .level-meter {
      position: relative; width: 5rem; height: 0.55rem;
      background: var(--idle-bg); border-radius: 999px; overflow: hidden;
    }
    .level-meter-fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: var(--success);
      transition: width 0.12s linear, background 0.12s linear;
    }
    .level-meter-fill.hot { background: var(--danger); }

    .channel-name-cell { white-space: nowrap; }
    .color-swatch {
      display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 3px;
      margin-right: 0.4rem; vertical-align: middle; border: 1px solid rgba(0, 0, 0, 0.25);
    }

    .event-log {
      max-height: 260px; overflow-y: auto;
      background: #0d0e12; color: #d7d8de;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      border-radius: var(--radius);
      padding: 0.75rem;
    }
    .event-log div { padding: 0.15rem 0; white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .event-log div:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>X32 AI Feedback Suppression</h1>
    <span id="connection-badge" class="badge status-pending"><span class="dot"></span><span id="connection-badge-text">Checking…</span></span>
  </header>

  <main>
    <div class="grid-3">
      <section class="card" id="console-setup">
        <h2>Console</h2>
        <div class="field">
          <label for="console-host">IP address</label>
          <input type="text" id="console-host" placeholder="10.10.0.142" style="width: 9.5rem;">
          <label for="console-port" style="min-width: auto;">Port</label>
          <input type="number" id="console-port" value="10023" style="width: 5.5rem;">
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="console-connect-btn">Connect</button>
          <button class="btn btn-secondary" id="console-disconnect-btn">Disconnect</button>
        </div>
        <div class="field">
          <button class="btn btn-secondary" id="console-search-btn">Search for Console</button>
        </div>
        <div class="field">
          <select id="console-search-results" style="flex: 1; min-width: 12rem;"></select>
          <button class="btn btn-secondary btn-sm" id="console-use-result-btn">Use Selected</button>
        </div>
        <div class="field">
          <label for="safety-scene-slot">Safety scene slot</label>
          <input type="number" id="safety-scene-slot" min="0" max="99" placeholder="--" style="width: 4.5rem;"
                 title="Console scene slot (0-99) to save the pre-app state into. Pick one you know is free -- it will be overwritten.">
          <button class="btn btn-secondary btn-sm" id="safety-scene-btn">Save Safety Scene</button>
        </div>
        <div id="console-status" class="status"></div>
      </section>

      <section class="card" id="device-setup">
        <h2>Device Setup</h2>
        <div class="field">
          <label for="audio-input">Audio input</label>
          <select id="audio-input" style="flex: 1;"></select>
        </div>
        <div class="field">
          <label for="audio-output">Audio output</label>
          <select id="audio-output" style="flex: 1;"></select>
        </div>
        <div class="field">
          <label for="midi-input">MIDI input</label>
          <select id="midi-input" style="flex: 1;"></select>
        </div>
        <div class="field">
          <label for="midi-output">MIDI output</label>
          <select id="midi-output" style="flex: 1;"></select>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" id="rescan-devices-btn">Rescan</button>
          <button class="btn btn-primary" id="save-devices-btn">Save</button>
        </div>
        <div id="device-status" class="status"></div>
      </section>

      <section class="card" id="global-controls">
        <h2>Global</h2>
        <div class="field">
          <label for="echo-toggle">Echo cancellation</label>
          <input type="checkbox" id="echo-toggle">
        </div>
        <div class="field">
          <label for="echo-ref-left">Reference L/R</label>
          <input type="number" id="echo-ref-left" min="1" max="48" placeholder="L" style="width: 4rem;">
          <input type="number" id="echo-ref-right" min="1" max="48" placeholder="R" style="width: 4rem;">
          <button class="btn btn-secondary btn-sm" id="echo-ref-set-btn">Set Reference</button>
        </div>
        <div id="echo-status" class="status"></div>
        <div class="field">
          <label for="gain-assist-toggle" title="LAST RESORT, opt-in: if a channel's notch bank is full and feedback is still detected, step its preamp gain down (2 dB steps, 6 dB max, loudly logged).">Gain assist</label>
          <input type="checkbox" id="gain-assist-toggle">
          <button class="btn btn-secondary btn-sm" id="gain-assist-restore-btn" title="Put every trimmed preamp back to its pre-trim gain">Restore Gains</button>
        </div>
        <div id="gain-assist-status" class="status"></div>
        <div class="field" style="margin-top: 0.6rem;">
          <button class="btn btn-danger" id="panic-btn"
                  title="Instantly mute every app-managed channel on the console. Un-panic restores each channel's previous mute state.">PANIC</button>
        </div>
        <div id="panic-status" class="status"></div>
      </section>
    </div>

    <section class="card" id="routing-panel">
      <h2>Routing</h2>
      <div class="btn-group">
        <button class="btn btn-secondary" id="snapshot-btn">Save Snapshot</button>
        <button class="btn btn-primary" id="apply-btn">Apply Routing</button>
        <button class="btn btn-secondary" id="restore-btn">Restore Snapshot</button>
        <button class="btn btn-secondary" id="bypass-all-btn">Bypass All</button>
        <button class="btn btn-secondary" id="reinsert-all-btn">Re-insert All</button>
        <button class="btn btn-secondary" id="refresh-names-btn">Refresh Names</button>
      </div>
      <div id="routing-status" class="status"></div>

      <div class="channel-toolbar">
        <span id="channel-count" class="channel-count"></span>
        <div class="channel-toolbar-controls">
          <select id="add-channel-select"></select>
          <label class="checkbox-field"><input type="checkbox" id="show-all-channels"> Show all 32</label>
        </div>
      </div>

      <div class="table-wrap">
        <table id="channel-table">
          <thead>
            <tr>
              <th></th><th>Ch</th><th>Name</th><th>State</th><th>Level</th><th>Aux Slot</th><th>MIDI Slot</th><th>Notches</th>
              <th>AI</th><th>Echo</th><th>Mode</th><th title="External = app processes audio via insert; Internal = app writes feedback notches into the console's own EQ, no insert">EQ</th><th>Sensitivity</th><th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="spectrum">
      <h2>Spectrum (console RTA)</h2>
      <div class="btn-group">
        <select id="rta-channel">
          <option value="">Console's current RTA source</option>
        </select>
        <button class="btn btn-secondary" id="rta-start-btn">Start</button>
        <button class="btn btn-secondary" id="rta-stop-btn">Stop</button>
      </div>
      <div id="rta-status" class="status"></div>
      <canvas id="rta-canvas" width="900" height="220" style="width: 100%; max-width: 100%; background: var(--idle-bg); border-radius: 6px;"></canvas>
    </section>

    <section class="card" id="diagnostics">
      <h2>Diagnostics</h2>
      <div class="btn-group">
        <button class="btn btn-secondary" id="export-btn">Export Debug Bundle</button>
      </div>
      <div id="export-status" class="status"></div>
      <div id="event-log" class="event-log"></div>
    </section>
  </main>

  <script>
    const el = (id) => document.getElementById(id);

    function setStatus(id, text, variant = "") {
      const node = el(id);
      node.textContent = text;
      node.classList.remove("error", "success");
      if (variant) node.classList.add(variant);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.error || `Server returned ${response.status}`);
      }
      return body;
    }

    function setConnectionBadge(connected, label) {
      const badge = el("connection-badge");
      badge.className = `badge ${connected ? "status-connected" : "status-disconnected"}`;
      el("connection-badge-text").textContent = label || (connected ? "Connected" : "Disconnected");
    }

    function populateSelect(select, items, selectedName) {
      select.innerHTML = "";
      const noneOption = document.createElement("option");
      noneOption.value = "";
      noneOption.textContent = "-- none --";
      select.appendChild(noneOption);
      for (const item of items) {
        const option = document.createElement("option");
        const name = typeof item === "string" ? item : item.name;
        option.value = name;
        option.textContent = name;
        if (name === selectedName) option.selected = true;
        select.appendChild(option);
      }
    }

    async function loadDevices() {
      try {
        const data = await api("/api/devices");
        populateSelect(el("audio-input"), data.audio_inputs, data.selected.audio_input_device);
        populateSelect(el("audio-output"), data.audio_outputs, data.selected.audio_output_device);
        populateSelect(el("midi-input"), data.midi_inputs, data.selected.midi_input_port);
        populateSelect(el("midi-output"), data.midi_outputs, data.selected.midi_output_port);
        const errors = [data.audio_error, data.midi_error].filter(Boolean);
        setStatus("device-status", errors.length ? errors.join("; ") : "Devices loaded.", errors.length ? "error" : "success");
      } catch (err) {
        setStatus("device-status", `Failed to load devices: ${err}`, "error");
      }
    }

    async function loadConsoleStatus() {
      try {
        const data = await api("/api/console/status");
        if (data.connected) {
          el("console-host").value = data.console_ip || "";
          el("console-port").value = data.console_port || 10023;
          setStatus("console-status", `Connected: ${data.xinfo.name || ""} ${data.xinfo.model || ""} (firmware ${data.xinfo.version || "?"})`, "success");
          setConnectionBadge(true, "Console connected");
        } else {
          setStatus("console-status", "Not connected.");
          setConnectionBadge(false, "Console disconnected");
        }
      } catch (err) {
        setStatus("console-status", `Failed to load console status: ${err}`, "error");
      }
    }

    async function loadEchoState() {
      try {
        const data = await api("/api/state");
        el("echo-toggle").checked = Boolean(data.config.echo_cancellation_enabled);
        showEchoReference(data.config.echo_reference_card_channels);
        if (data.config.safety_scene_slot !== null && data.config.safety_scene_slot !== undefined) {
          el("safety-scene-slot").value = data.config.safety_scene_slot;
        }
      } catch (err) {
        setStatus("echo-status", `Failed to load echo cancellation state: ${err}`, "error");
      }
    }

    el("gain-assist-toggle").addEventListener("change", async () => {
      const enabled = el("gain-assist-toggle").checked;
      try {
        await api("/api/gain_assist/toggle", { method: "POST", body: JSON.stringify({ enabled }) });
        setStatus("gain-assist-status", enabled
          ? "Gain assist armed: saturated channels may get preamp trims (watch the event log)."
          : "Gain assist off.", enabled ? "error" : "success");
      } catch (err) {
        setStatus("gain-assist-status", `Toggle failed: ${err}`, "error");
        el("gain-assist-toggle").checked = !enabled;
      }
    });

    el("gain-assist-restore-btn").addEventListener("click", async () => {
      try {
        const data = await api("/api/gain_assist/restore", { method: "POST" });
        setStatus("gain-assist-status", data.restored_headamps.length
          ? `Restored preamp gain on headamp(s) ${data.restored_headamps.join(", ")}.`
          : "No trims to restore.", "success");
      } catch (err) {
        setStatus("gain-assist-status", `Restore failed: ${err}`, "error");
      }
    });

    async function loadGainAssistState() {
      try {
        const data = await api("/api/gain_assist/status");
        el("gain-assist-toggle").checked = Boolean(data.enabled);
        const trims = Object.entries(data.trims_db || {});
        if (trims.length) {
          setStatus("gain-assist-status",
            "Active trims: " + trims.map(([ha, db]) => `headamp ${ha}: -${db} dB`).join(", "), "error");
        }
      } catch (err) {
        // non-fatal
      }
    }

    let panicActive = false;

    function renderPanicButton() {
      const btn = el("panic-btn");
      btn.textContent = panicActive ? "UN-PANIC" : "PANIC";
      btn.title = panicActive
        ? "Restore every channel's pre-panic mute state"
        : "Instantly mute every app-managed channel on the console. Un-panic restores each channel's previous mute state.";
    }

    el("panic-btn").addEventListener("click", async () => {
      try {
        if (!panicActive) {
          const data = await api("/api/panic", { method: "POST" });
          panicActive = true;
          setStatus("panic-status", `Muted channels ${data.channels.join(", ")}.`, "error");
        } else {
          await api("/api/panic/restore", { method: "POST" });
          panicActive = false;
          setStatus("panic-status", "Mute states restored.", "success");
        }
        renderPanicButton();
      } catch (err) {
        setStatus("panic-status", `Panic action failed: ${err}`, "error");
      }
    });

    async function loadPanicState() {
      try {
        const data = await api("/api/state");
        panicActive = Boolean(data.state.panic_active);
        renderPanicButton();
      } catch (err) {
        // non-fatal; button defaults to PANIC
      }
    }

    el("safety-scene-btn").addEventListener("click", async () => {
      const slot = parseInt(el("safety-scene-slot").value, 10);
      if (Number.isNaN(slot)) {
        setStatus("console-status", "Enter a scene slot number (0-99) first.", "error");
        return;
      }
      if (!window.confirm(`Save the console's current state into scene slot ${slot}? Anything already in that slot will be overwritten.`)) {
        return;
      }
      try {
        const data = await api("/api/console/save_safety_scene", {
          method: "POST",
          body: JSON.stringify({ slot }),
        });
        setStatus("console-status", `Safety scene saved to slot ${data.slot}.`, "success");
      } catch (err) {
        setStatus("console-status", `Safety scene save failed: ${err}`, "error");
      }
    });

    el("console-connect-btn").addEventListener("click", async () => {
      const host = el("console-host").value.trim();
      if (!host) {
        setStatus("console-status", "Enter a console IP first.", "error");
        return;
      }
      setStatus("console-status", `Connecting to ${host}...`);
      try {
        const data = await api("/api/console/connect", {
          method: "POST",
          body: JSON.stringify({ host, port: parseInt(el("console-port").value, 10) || 10023 }),
        });
        setStatus("console-status", `Connected: ${data.xinfo.name || ""} ${data.xinfo.model || ""} (firmware ${data.xinfo.version || "?"})`, "success");
        setConnectionBadge(true, "Console connected");
        await loadChannels();
        try {
          // Best-effort -- names/colors are cosmetic, so a slow or
          // non-replying console here shouldn't surface as an error.
          await api("/api/channels/refresh_names", { method: "POST" });
          await loadChannels();
        } catch (err) {
          // ignore
        }
      } catch (err) {
        setStatus("console-status", `Connect failed: ${err}`, "error");
        setConnectionBadge(false, "Console disconnected");
      }
    });

    el("console-disconnect-btn").addEventListener("click", async () => {
      try {
        await api("/api/console/disconnect", { method: "POST" });
        setStatus("console-status", "Disconnected.");
        setConnectionBadge(false, "Console disconnected");
      } catch (err) {
        setStatus("console-status", `Disconnect failed: ${err}`, "error");
      }
    });

    el("console-search-btn").addEventListener("click", async () => {
      setStatus("console-status", "Searching the local network...");
      const select = el("console-search-results");
      select.innerHTML = "";
      try {
        const data = await api("/api/console/search", { method: "POST", body: JSON.stringify({}) });
        if (!data.consoles.length) {
          setStatus("console-status", "No consoles found on the local network.");
          return;
        }
        for (const found of data.consoles) {
          const option = document.createElement("option");
          option.value = JSON.stringify({ host: found.host, port: found.port });
          option.textContent = `${found.host} -- ${found.name} (${found.model}, firmware ${found.version})`;
          select.appendChild(option);
        }
        setStatus("console-status", `Found ${data.consoles.length} console(s).`, "success");
      } catch (err) {
        setStatus("console-status", `Search failed: ${err}`, "error");
      }
    });

    el("console-use-result-btn").addEventListener("click", () => {
      const select = el("console-search-results");
      if (!select.value) return;
      const picked = JSON.parse(select.value);
      el("console-host").value = picked.host;
      el("console-port").value = picked.port;
    });

    el("rescan-devices-btn").addEventListener("click", loadDevices);

    el("save-devices-btn").addEventListener("click", async () => {
      try {
        await api("/api/devices/select", {
          method: "POST",
          body: JSON.stringify({
            audio_input_device: el("audio-input").value || null,
            audio_output_device: el("audio-output").value || null,
            midi_input_port: el("midi-input").value || null,
            midi_output_port: el("midi-output").value || null,
          }),
        });
        setStatus("device-status", "Saved.", "success");
      } catch (err) {
        setStatus("device-status", `Save failed: ${err}`, "error");
      }
    });

    // -- Channel table: not all 32 channels are shown at once. A small
    // visible set (default 1-4) is remembered in localStorage; channels
    // that are actually in play this session (inserted, or holding a Card
    // slot from a previous insert) are always shown regardless, so an
    // active channel can never silently disappear from view. "Show all
    // 32" is an escape hatch for anyone who really does want the full grid.
    const VISIBLE_CHANNELS_KEY = "x32_visible_channels";
    const DEFAULT_VISIBLE_CHANNELS = [1, 2, 3, 4];

    function loadVisibleChannels() {
      try {
        const raw = localStorage.getItem(VISIBLE_CHANNELS_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return new Set(Array.isArray(parsed) && parsed.length ? parsed : DEFAULT_VISIBLE_CHANNELS);
      } catch {
        return new Set(DEFAULT_VISIBLE_CHANNELS);
      }
    }

    function saveVisibleChannels() {
      localStorage.setItem(VISIBLE_CHANNELS_KEY, JSON.stringify(Array.from(visibleChannels)));
    }

    let visibleChannels = loadVisibleChannels();
    let showAllChannels = false;
    let latestChannels = [];
    let latestLevels = {};

    // X32 scribble-strip color tokens -> CSS colors. RD/GN/YE/BL/CY are
    // independently confirmed against a real scene file dump
    // (app.osc.scribble_strip.CONFIRMED_COLORS); MG/WH/OFF follow the
    // documented standard palette by convention, not independently verified.
    const SCRIBBLE_COLOR_MAP = {
      OFF: "#888888", RD: "#e04040", GN: "#40c060", YE: "#e0c020",
      BL: "#4070e0", MG: "#c050c0", CY: "#40c0d0", WH: "#e0e0e0",
    };

    function channelRow(channel, isActive) {
      const tr = document.createElement("tr");
      tr.dataset.channel = channel.index;
      tr.className = channel.card_out_slot === null ? "" : (channel.inserted ? "state-inserted" : "state-bypassed");

      const hideCell = document.createElement("td");
      const hideBtn = document.createElement("button");
      hideBtn.className = "icon-btn";
      hideBtn.textContent = "✕";
      hideBtn.title = isActive ? "Active channels stay visible" : "Hide from view";
      hideBtn.disabled = isActive;
      hideBtn.addEventListener("click", () => {
        visibleChannels.delete(channel.index);
        saveVisibleChannels();
        renderChannelTable();
      });
      hideCell.appendChild(hideBtn);
      tr.appendChild(hideCell);

      const cell = (text) => { const td = document.createElement("td"); td.textContent = text; return td; };
      tr.appendChild(cell(channel.index));

      const nameCell = document.createElement("td");
      nameCell.className = "channel-name-cell";
      if (channel.scribble_name) {
        const swatch = document.createElement("span");
        swatch.className = "color-swatch";
        // Inverted palette variants ("YEi") use the same base color.
        const colorToken = (channel.scribble_color || "").replace(/i$/, "");
        swatch.style.backgroundColor = SCRIBBLE_COLOR_MAP[colorToken] || SCRIBBLE_COLOR_MAP.OFF;
        nameCell.appendChild(swatch);
        nameCell.appendChild(document.createTextNode(channel.scribble_name));
      } else {
        nameCell.textContent = "-";
      }
      tr.appendChild(nameCell);

      const stateCell = document.createElement("td");
      const chip = document.createElement("span");
      if (channel.card_out_slot === null) {
        chip.className = "chip idle";
        chip.textContent = "Idle";
      } else if (channel.inserted) {
        chip.className = "chip inserted";
        chip.textContent = "Inserted";
      } else {
        chip.className = "chip bypassed";
        chip.textContent = "Bypassed";
      }
      stateCell.appendChild(chip);
      tr.appendChild(stateCell);

      const levelCell = document.createElement("td");
      // Always show an input meter: the engine measures RMS on every Card
      // input channel it reads (Card output = Local 1:1), not just inserted
      // ones, so this is a live "is audio arriving on this channel" check
      // even before a channel is applied. Levels are keyed by console
      // channel number.
      const meter = document.createElement("div");
      meter.className = "level-meter";
      meter.dataset.channel = channel.index;
      const fill = document.createElement("div");
      fill.className = "level-meter-fill";
      meter.appendChild(fill);
      levelCell.appendChild(meter);
      tr.appendChild(levelCell);

      tr.appendChild(cell(channel.card_out_slot ?? "-"));
      tr.appendChild(cell(channel.midi_slot ?? "-"));
      tr.appendChild(cell(channel.active_notch_count));

      const selectCell = document.createElement("td");
      const selectCheckbox = document.createElement("input");
      selectCheckbox.type = "checkbox";
      selectCheckbox.className = "channel-select";
      selectCell.appendChild(selectCheckbox);
      // Reinsert the apply-selection checkbox before the Ch column so it
      // reads left-to-right as [hide][select][ch]... -- kept as a
      // separate cell rather than folded into hide to keep each
      // control's purpose unambiguous.
      tr.insertBefore(selectCell, tr.children[1]);

      const aiCell = document.createElement("td");
      const aiCheckbox = document.createElement("input");
      aiCheckbox.type = "checkbox";
      aiCheckbox.checked = channel.ai_enabled;
      aiCheckbox.addEventListener("change", async () => {
        try {
          await api(`/api/channels/${channel.index}/ai_toggle`, {
            method: "POST",
            body: JSON.stringify({ enabled: aiCheckbox.checked }),
          });
        } catch (err) {
          setStatus("routing-status", `AI toggle failed: ${err}`, "error");
          aiCheckbox.checked = !aiCheckbox.checked;
        }
      });
      aiCell.appendChild(aiCheckbox);
      tr.appendChild(aiCell);

      const echoCell = document.createElement("td");
      const echoCheckbox = document.createElement("input");
      echoCheckbox.type = "checkbox";
      echoCheckbox.checked = channel.echo_cancellation_enabled;
      echoCheckbox.title = "Echo cancellation for this channel (needs the global toggle + reference enabled too)";
      echoCheckbox.addEventListener("change", async () => {
        try {
          await api(`/api/channels/${channel.index}/echo_toggle`, {
            method: "POST",
            body: JSON.stringify({ enabled: echoCheckbox.checked }),
          });
        } catch (err) {
          setStatus("routing-status", `Echo toggle failed: ${err}`, "error");
          echoCheckbox.checked = !echoCheckbox.checked;
        }
      });
      echoCell.appendChild(echoCheckbox);
      tr.appendChild(echoCell);

      const modeCell = document.createElement("td");
      const modeSelect = document.createElement("select");
      for (const mode of ["live", "ring_out"]) {
        const option = document.createElement("option");
        option.value = mode;
        option.textContent = mode;
        if (mode === channel.mode) option.selected = true;
        modeSelect.appendChild(option);
      }
      modeSelect.addEventListener("change", async () => {
        try {
          await api(`/api/channels/${channel.index}/settings`, {
            method: "POST",
            body: JSON.stringify({ mode: modeSelect.value }),
          });
        } catch (err) {
          setStatus("routing-status", `Mode update failed: ${err}`, "error");
        }
      });
      modeCell.appendChild(modeSelect);
      tr.appendChild(modeCell);

      const eqModeCell = document.createElement("td");
      const eqModeSelect = document.createElement("select");
      for (const [value, label] of [["external", "Ext"], ["internal", "Int"]]) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        if (value === (channel.eq_mode || "external")) option.selected = true;
        eqModeSelect.appendChild(option);
      }
      eqModeSelect.title =
        "External: app processes audio via the channel insert (console EQ untouched). " +
        "Internal: app writes detected feedback notches into the channel's own console " +
        "EQ (no insert) -- its 4 bands are snapshotted first and restored when you switch back.";
      eqModeSelect.addEventListener("change", async () => {
        const goingInternal = eqModeSelect.value === "internal";
        if (goingInternal && !confirm(
          "Internal EQ lets the app write feedback notches into channel " + channel.index +
          "'s console 4-band EQ. Your current EQ on that channel is snapshotted and restored " +
          "when you switch back to External, but while active the app manages those bands. Continue?"
        )) {
          eqModeSelect.value = channel.eq_mode || "external";
          return;
        }
        try {
          await api(`/api/channels/${channel.index}/settings`, {
            method: "POST",
            body: JSON.stringify({ eq_mode: eqModeSelect.value }),
          });
          await loadChannels();
        } catch (err) {
          setStatus("routing-status", `EQ mode update failed: ${err}`, "error");
        }
      });
      eqModeCell.appendChild(eqModeSelect);
      tr.appendChild(eqModeCell);

      const sensitivityCell = document.createElement("td");
      const sensitivityInput = document.createElement("input");
      sensitivityInput.type = "number";
      sensitivityInput.className = "num-input";
      sensitivityInput.min = "0";
      sensitivityInput.max = "1";
      sensitivityInput.step = "0.05";
      sensitivityInput.value = channel.sensitivity;
      sensitivityInput.addEventListener("change", async () => {
        try {
          await api(`/api/channels/${channel.index}/settings`, {
            method: "POST",
            body: JSON.stringify({ sensitivity: parseFloat(sensitivityInput.value) }),
          });
        } catch (err) {
          setStatus("routing-status", `Sensitivity update failed: ${err}`, "error");
        }
      });
      sensitivityCell.appendChild(sensitivityInput);
      tr.appendChild(sensitivityCell);

      const bypassCell = document.createElement("td");
      const bypassBtn = document.createElement("button");
      bypassBtn.className = "btn btn-secondary btn-sm";
      bypassBtn.textContent = channel.inserted ? "Bypass" : "Insert";
      bypassBtn.disabled = channel.card_out_slot === null;
      bypassBtn.addEventListener("click", async () => {
        try {
          await api(`/api/channels/${channel.index}/bypass`, { method: "POST" });
          await loadChannels();
        } catch (err) {
          setStatus("routing-status", `Bypass failed: ${err}`, "error");
        }
      });
      bypassCell.appendChild(bypassBtn);

      // Burn active notches into the console's own channel EQ (persists
      // with the app out of the audio path), and undo that.
      const eqCommitBtn = document.createElement("button");
      eqCommitBtn.className = "btn btn-secondary btn-sm";
      eqCommitBtn.textContent = "EQ→Desk";
      eqCommitBtn.title = "Write the deepest active notches into this channel's console EQ (max 4 bands)";
      eqCommitBtn.disabled = channel.active_notch_count === 0;
      eqCommitBtn.addEventListener("click", async () => {
        try {
          const data = await api(`/api/channels/${channel.index}/eq/commit`, { method: "POST" });
          const bands = data.written.map((w) => `${w.frequency_hz}Hz ${w.gain_db}dB${w.gain_clamped ? " (clamped)" : ""}`);
          setStatus("routing-status", `Ch ${channel.index} console EQ written: ${bands.join(", ")}`, "success");
          await loadChannels();
        } catch (err) {
          setStatus("routing-status", `EQ commit failed: ${err}`, "error");
          await loadChannels();  // restore may have become available even on failure
        }
      });
      bypassCell.appendChild(eqCommitBtn);

      if (channel.has_console_eq_snapshot) {
        const eqRestoreBtn = document.createElement("button");
        eqRestoreBtn.className = "btn btn-secondary btn-sm";
        eqRestoreBtn.textContent = "EQ Undo";
        eqRestoreBtn.title = "Restore this channel's console EQ to its pre-commit state";
        eqRestoreBtn.addEventListener("click", async () => {
          try {
            await api(`/api/channels/${channel.index}/eq/restore`, { method: "POST" });
            setStatus("routing-status", `Ch ${channel.index} console EQ restored.`, "success");
            await loadChannels();
          } catch (err) {
            setStatus("routing-status", `EQ restore failed: ${err}`, "error");
          }
        });
        bypassCell.appendChild(eqRestoreBtn);
      }
      tr.appendChild(bypassCell);

      return tr;
    }

    function updateAddChannelSelect(shown) {
      const select = el("add-channel-select");
      const shownIndexes = new Set(shown.map((c) => c.index));
      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "+ Add channel…";
      select.appendChild(placeholder);
      for (const channel of latestChannels) {
        if (shownIndexes.has(channel.index)) continue;
        const option = document.createElement("option");
        option.value = channel.index;
        option.textContent = `Channel ${channel.index}`;
        select.appendChild(option);
      }
      select.disabled = showAllChannels || select.children.length <= 1;
    }

    function renderChannelTable() {
      const tbody = document.querySelector("#channel-table tbody");
      tbody.innerHTML = "";

      const active = new Set(
        latestChannels.filter((c) => c.inserted || c.card_out_slot !== null).map((c) => c.index)
      );
      const toShow = showAllChannels
        ? latestChannels
        : latestChannels.filter((c) => visibleChannels.has(c.index) || active.has(c.index));

      for (const channel of toShow) {
        tbody.appendChild(channelRow(channel, active.has(channel.index)));
      }

      el("channel-count").textContent = showAllChannels
        ? `Showing all ${latestChannels.length} channels.`
        : `Showing ${toShow.length} of ${latestChannels.length} channels.`;

      updateAddChannelSelect(toShow);
      applyLevels(latestLevels);  // freshly-created meter bars start from the last known reading, not 0
      populateRtaChannels();
    }

    el("add-channel-select").addEventListener("change", () => {
      const select = el("add-channel-select");
      const value = parseInt(select.value, 10);
      if (!value) return;
      visibleChannels.add(value);
      saveVisibleChannels();
      renderChannelTable();
    });

    el("show-all-channels").addEventListener("change", () => {
      showAllChannels = el("show-all-channels").checked;
      renderChannelTable();
    });

    async function loadChannels() {
      try {
        const data = await api("/api/channels");
        latestChannels = data.channels;
        renderChannelTable();
      } catch (err) {
        setStatus("routing-status", `Failed to load channels: ${err}`, "error");
      }
    }

    function selectedChannels() {
      return Array.from(document.querySelectorAll(".channel-select:checked"))
        .map((cb) => parseInt(cb.closest("tr").dataset.channel, 10));
    }

    el("snapshot-btn").addEventListener("click", async () => {
      try {
        const data = await api("/api/routing/snapshot", { method: "POST" });
        setStatus("routing-status", `Snapshot saved: ${data.name}`, "success");
      } catch (err) {
        setStatus("routing-status", `Snapshot failed: ${err}`, "error");
      }
    });

    el("apply-btn").addEventListener("click", async () => {
      const channels = selectedChannels();
      if (!channels.length) {
        setStatus("routing-status", "Select at least one channel first.", "error");
        return;
      }
      try {
        const data = await api("/api/routing/apply", { method: "POST", body: JSON.stringify({ channels }) });
        let msg = `Applied insert routing for channels: ${channels.join(", ")}`;
        if (data.aux_out_insert_unconfirmed) {
          msg += " — NOTE: the Aux Out \"Insert\" value isn't configured yet, so set each used Aux Out to Insert on the desk (or set aux_out_insert_src_value in config).";
        }
        setStatus("routing-status", msg, data.aux_out_insert_unconfirmed ? "error" : "success");
        await loadChannels();
      } catch (err) {
        setStatus("routing-status", `Apply failed: ${err}`, "error");
      }
    });

    el("restore-btn").addEventListener("click", async () => {
      try {
        const data = await api("/api/routing/restore", { method: "POST" });
        setStatus("routing-status", data.mismatches.length
          ? `Restored with ${data.mismatches.length} mismatch(es) -- see event log`
          : "Restored.", data.mismatches.length ? "error" : "success");
        await loadChannels();
      } catch (err) {
        setStatus("routing-status", `Restore failed: ${err}`, "error");
      }
    });

    el("bypass-all-btn").addEventListener("click", async () => {
      try {
        await api("/api/routing/bypass_all", { method: "POST", body: JSON.stringify({ bypass: true }) });
        await loadChannels();
      } catch (err) {
        setStatus("routing-status", `Bypass all failed: ${err}`, "error");
      }
    });

    el("reinsert-all-btn").addEventListener("click", async () => {
      try {
        await api("/api/routing/bypass_all", { method: "POST", body: JSON.stringify({ bypass: false }) });
        await loadChannels();
      } catch (err) {
        setStatus("routing-status", `Re-insert all failed: ${err}`, "error");
      }
    });

    el("refresh-names-btn").addEventListener("click", async () => {
      try {
        await api("/api/channels/refresh_names", { method: "POST" });
        await loadChannels();
        setStatus("routing-status", "Channel names/colors refreshed from console.", "success");
      } catch (err) {
        setStatus("routing-status", `Refresh names failed: ${err}`, "error");
      }
    });

    function showEchoReference(refChannels) {
      if (refChannels && refChannels.length === 2) {
        el("echo-ref-left").value = refChannels[0];
        el("echo-ref-right").value = refChannels[1];
      }
    }

    el("echo-toggle").addEventListener("change", async () => {
      const enabled = el("echo-toggle").checked;
      try {
        const data = await api("/api/echo_cancellation/toggle", {
          method: "POST",
          body: JSON.stringify({ enabled }),
        });
        showEchoReference(data.reference_card_channels);
        setStatus("echo-status", data.reference_card_channels && data.reference_card_channels.length
          ? `Reference: Card ${data.reference_card_channels.join(", ")}`
          : (enabled ? "Enabled." : "Disabled."), "success");
      } catch (err) {
        setStatus("echo-status", `Failed: ${err}`, "error");
        el("echo-toggle").checked = !enabled;
      }
    });

    el("echo-ref-set-btn").addEventListener("click", async () => {
      const left = parseInt(el("echo-ref-left").value, 10);
      const right = parseInt(el("echo-ref-right").value, 10);
      if (!left || !right) {
        setStatus("echo-status", "Enter both a left and right Card slot number.", "error");
        return;
      }
      try {
        const data = await api("/api/echo_cancellation/reference", {
          method: "POST",
          body: JSON.stringify({ card_channels: [left, right] }),
        });
        showEchoReference(data.reference_card_channels);
        setStatus("echo-status", `Reference set: Card ${data.reference_card_channels.join(", ")}`, "success");
      } catch (err) {
        setStatus("echo-status", `Set reference failed: ${err}`, "error");
      }
    });

    el("export-btn").addEventListener("click", async () => {
      setStatus("export-status", "Building debug bundle...");
      try {
        const response = await fetch("/api/diagnostics/export", { method: "POST" });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        const blob = await response.blob();
        const disposition = response.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : "debug_bundle.zip";

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus("export-status", `Downloaded ${filename}`, "success");
      } catch (err) {
        setStatus("export-status", `Export failed: ${err}`, "error");
      }
    });

    function appendEvent(event) {
      const log = el("event-log");
      const line = document.createElement("div");
      line.textContent = `[${event.timestamp}] ${event.category} :: ${JSON.stringify(event.payload)}`;
      log.appendChild(line);
      while (log.children.length > 200) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }

    async function loadRecentEvents() {
      try {
        const data = await api("/api/events?limit=100");
        for (const event of data.events) appendEvent(event);
      } catch (err) {
        // Non-fatal -- live events still arrive over the socket below.
      }
    }

    // Levels are keyed by console channel number (a string, since JSON has
    // no int keys) -- "is signal actually arriving on this channel,"
    // measured directly from the audio this app is processing, not the
    // console's own /meters OSC blobs.
    function applyLevels(levels) {
      latestLevels = levels;
      document.querySelectorAll(".level-meter").forEach((meter) => {
        const dbfs = levels[meter.dataset.channel];
        const fill = meter.querySelector(".level-meter-fill");
        if (dbfs === undefined) {
          fill.style.width = "0%";
          return;
        }
        const pct = Math.max(0, Math.min(100, ((dbfs + 60) / 60) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.toggle("hot", dbfs > -3);
      });
    }

    async function loadInitialLevels() {
      try {
        const data = await api("/api/channels/meters");
        applyLevels(data.levels);
      } catch (err) {
        // Non-fatal -- live levels still arrive over the socket below.
      }
    }

    if (typeof io !== "undefined") {
      const socket = io();
      socket.on("diagnostics_event", (event) => {
        appendEvent(event);
        if (event.category === "state_change" || event.category === "watchdog") {
          loadChannels();
        }
      });
      socket.on("channel_meters", applyLevels);
      // rtaRunning/drawRta are declared below; the callback only fires
      // after the whole script has run, so the references are safe.
      socket.on("rta", (msg) => {
        if (!rtaRunning) return;
        rtaLatestBins = msg.bins;
        requestAnimationFrame(drawRta);
      });
    }

    // -- spectrum (console RTA) ------------------------------------------
    // 100 RTA bins assumed log-spaced 20 Hz - 20 kHz (matches the desk's
    // own RTA display range); notch markers use the same mapping.
    const RTA_DB_FLOOR = -90;
    let rtaRunning = false;
    let rtaLatestBins = null;
    let rtaNotches = [];
    let rtaNotchTimer = null;

    function rtaChannelValue() {
      const raw = el("rta-channel").value;
      return raw === "" ? null : parseInt(raw, 10);
    }

    function populateRtaChannels() {
      const select = el("rta-channel");
      const keep = select.value;
      while (select.options.length > 1) select.remove(1);
      for (const channel of latestChannels) {
        const option = document.createElement("option");
        option.value = channel.index;
        option.textContent = channel.scribble_name
          ? `Ch ${channel.index}: ${channel.scribble_name}` : `Ch ${channel.index}`;
        select.appendChild(option);
      }
      select.value = keep;
    }

    function drawRta() {
      const canvas = el("rta-canvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!rtaLatestBins) return;
      const n = rtaLatestBins.length;
      const barWidth = canvas.width / n;
      ctx.fillStyle = "#40c0d0";
      for (let i = 0; i < n; i++) {
        const db = Math.max(rtaLatestBins[i], RTA_DB_FLOOR);
        const h = ((db - RTA_DB_FLOOR) / -RTA_DB_FLOOR) * canvas.height;
        ctx.fillRect(i * barWidth, canvas.height - h, Math.max(barWidth - 1, 1), h);
      }
      // Notch markers: log-position 20 Hz - 20 kHz across the width.
      ctx.strokeStyle = "#e04040";
      ctx.lineWidth = 2;
      for (const notch of rtaNotches) {
        const x = (Math.log(notch.frequency_hz / 20) / Math.log(1000)) * canvas.width;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
    }

    async function refreshRtaNotches() {
      const channel = rtaChannelValue();
      if (channel === null) { rtaNotches = []; return; }
      try {
        const data = await api(`/api/channels/${channel}/notches`);
        rtaNotches = data.notches;
      } catch (err) {
        rtaNotches = [];
      }
    }

    el("rta-start-btn").addEventListener("click", async () => {
      try {
        await api("/api/rta/start", { method: "POST", body: JSON.stringify({ channel: rtaChannelValue() }) });
        rtaRunning = true;
        setStatus("rta-status", "Streaming console RTA.", "success");
        refreshRtaNotches();
        if (rtaNotchTimer === null) rtaNotchTimer = setInterval(refreshRtaNotches, 2000);
      } catch (err) {
        setStatus("rta-status", `RTA start failed: ${err}`, "error");
      }
    });

    el("rta-stop-btn").addEventListener("click", async () => {
      try {
        await api("/api/rta/stop", { method: "POST" });
      } catch (err) {
        // fall through -- stop locally regardless
      }
      rtaRunning = false;
      if (rtaNotchTimer !== null) { clearInterval(rtaNotchTimer); rtaNotchTimer = null; }
      setStatus("rta-status", "Stopped.");
    });

    loadConsoleStatus();
    loadDevices();
    loadChannels();
    loadRecentEvents();
    loadInitialLevels();
    loadEchoState();
    loadPanicState();
    loadGainAssistState();
  </script>
</body>
</html>
